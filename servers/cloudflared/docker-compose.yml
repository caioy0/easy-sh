services:
  # Cloudflare Tunnel — secure HTTPS remote access to local web dashboards
  #
  # Prereqs (see cloudflared/setup.sh):
  #   * cloudflared tunnel create <id>  -> produces <id>.json
  #   * cloudflared/credentials/<id>.json  (mounted read-only)
  #   * cloudflared/config.yml             (generated: tunnel id + ingress)
  #
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    # host networking lets the tunnel reach services bound to the host's
    # loopback (e.g. Dockge on http://localhost:5001).
    network_mode: host
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      # ingress + tunnel id (generated by setup.sh)
      - ./config.yml:/etc/cloudflared/config.yml:ro
      # named-tunnel credentials json (read-only, never mounted writable)
      - ./credentials:/etc/cloudflared/credentials:ro